<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Uprise">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='14' fill='%23070707' stroke='%23f5f5f5' stroke-width='2.5'/%3E%3Cpath d='M32 46V20M20 32l12-12 12 12' fill='none' stroke='%23f5f5f5' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Uprise | Growth</title>
<style>
  :root {
    --bg: #070707;
    --panel: #0f0f0f;
    --line: #242424;
    --line2: #3a3a3a;
    --text: #ececec;
    --mute: #8c8c8c;
    --dim: #555;
    --hi: #f5f5f5;
    --danger: #ff9b9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #161616, #070707 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* ---------- Logo ---------- */
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 38px; height: 38px; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(255,255,255,.25)); }
  .wordmark { font-weight: 800; letter-spacing: .32em; font-size: 18px; color: var(--hi); line-height: 1; }
  .wordmark small { display: block; font-size: 9px; letter-spacing: .3em; color: var(--dim); font-weight: 400; margin-top: 6px; }

  /* ---------- Sidebar ---------- */
  .side {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
    background: #0a0a0a; border-right: 1px solid var(--line);
    overflow-y: auto; z-index: 20;
  }
  .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--line); cursor: default; user-select: none; }
  .player { display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .av {
    width: 42px; height: 42px; border: 1px solid #d4d4d4; object-fit: cover;
    display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 0 14px rgba(255,255,255,.08);
  }
  .av.ph { font-size: 20px; color: var(--hi); }
  .av.big-av { width: 96px; height: 96px; font-size: 40px; }
  .pname { font-weight: 600; }
  .sect { font-size: 11px; letter-spacing: .25em; color: var(--dim); padding: 18px 20px 6px; }
  .nav {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: 0; border-left: 2px solid transparent;
    color: var(--mute); padding: 10px 20px; font: inherit; font-size: 14px;
    text-align: left; cursor: pointer;
  }
  .nav:hover { color: var(--text); background: #141414; }
  .nav.on { color: var(--hi); border-left-color: #e5e5e5; background: #151515; }
  .ico { width: 18px; text-align: center; font-size: 15px; }
  .side-add {
    margin: 14px 20px; width: calc(100% - 40px); background: transparent;
    border: 1px dashed var(--line2); color: var(--mute); padding: 10px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .side-add:hover { color: var(--hi); border-color: #888; }

  /* ---------- Content ---------- */
  .content { margin-left: 260px; padding: 32px 36px; max-width: 1100px; }
  .scrim { display: none; }
  .menu { display: none; margin-bottom: 16px; }
  .title { font-size: 24px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 4px; }
  .sub { color: var(--mute); font-size: 13px; margin-bottom: 24px; }

  .panel { background: var(--panel); border: 1px solid var(--line); padding: 18px; position: relative; margin-bottom: 16px; }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid #e5e5e5; pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .head {
    font-size: 12px; letter-spacing: .3em; color: var(--mute); text-transform: uppercase;
    margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .label { font-size: 11px; letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }
  .big { font-size: 40px; font-weight: 800; color: var(--hi); line-height: 1.1; }
  .rank { font-size: 34px; font-weight: 900; color: var(--hi); line-height: 1.1; text-shadow: 0 0 18px rgba(255,255,255,.15); }
  .meta { font-size: 12px; color: var(--mute); margin-top: 4px; letter-spacing: .04em; }
  .xp { font-variant-numeric: tabular-nums; color: var(--hi); font-weight: 600; }

  .bar { height: 6px; background: #222; margin-top: 12px; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #5a5a5a, #f2f2f2); }

  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1a1a1a; }
  .row:last-child { border-bottom: 0; }
  .quest-title { font-weight: 600; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .btn {
    background: transparent; color: var(--text); border: 1px solid var(--line2);
    padding: 8px 12px; font: inherit; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; cursor: pointer;
  }
  .btn:hover { border-color: #e5e5e5; background: #1a1a1a; }
  .btn.solid { background: #e5e5e5; color: #080808; border-color: #e5e5e5; }
  .btn.solid:hover { background: #fff; }
  .btn.danger { border-color: #7a2a2a; color: var(--danger); }
  .btn.danger:hover { border-color: #ff6b6b; background: #2a0f0f; }

  input:not([type=checkbox]):not([type=file]):not([type=range]) {
    background: #0b0b0b; border: 1px solid var(--line2); color: var(--text);
    padding: 10px 12px; font: inherit; font-size: 16px; width: 100%; outline: none;
  }
  input:focus { border-color: #888; }
  input[type=range] { width: 100%; accent-color: #f5f5f5; }
  .slider-row { display: grid; grid-template-columns: 70px 1fr 56px; gap: 10px; align-items: center; }
  .sel { background: #0b0b0b; border: 1px solid var(--line2); color: var(--text); padding: 9px 10px; font: inherit; font-size: 13px; }

  .check {
    width: 26px; height: 26px; border: 1px solid #555; background: none; color: #000;
    cursor: pointer; flex-shrink: 0; font-size: 14px; font-weight: 700;
    display: grid; place-items: center; padding: 0;
  }
  .check.done { background: #e5e5e5; border-color: #e5e5e5; }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { font-size: 11px; color: var(--dim); text-align: center; letter-spacing: .1em; padding: 4px 0; }
  .day { min-height: 54px; background: #0b0b0b; border: 1px solid #1d1d1d; padding: 6px; font-size: 13px; cursor: pointer; color: var(--mute); position: relative; }
  .day:hover { border-color: #444; }
  .day.today { border-color: #e5e5e5; color: var(--hi); }
  .day.sel { background: #1b1b1b; color: var(--hi); border-color: #888; }
  .day .d { position: absolute; bottom: 6px; right: 6px; width: 5px; height: 5px; background: #e5e5e5; border-radius: 50%; }
  .widget-cal .day { min-height: 40px; cursor: default; }

  /* Picture board (grows downward as pictures are added) */
  .board {
    position: relative; width: 100%; min-height: 560px; background: #000;
    border: 1px solid var(--line2); overflow: hidden; user-select: none;
    background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .board-hint {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    color: var(--dim); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; text-align: center; padding: 20px;
  }
  .pic { position: absolute; touch-action: none; cursor: move; }
  .pic .crop { position: absolute; inset: 0; overflow: hidden; }
  .pic img { position: absolute; max-width: none; pointer-events: none; }
  .pic.sel { outline: 1px solid #f5f5f5; }
  .hnd { position: absolute; width: 12px; height: 12px; background: #f5f5f5; border: 1px solid #000; z-index: 3; touch-action: none; }
  .h-l { left: -7px; top: calc(50% - 6px); cursor: ew-resize; }
  .h-r { right: -7px; top: calc(50% - 6px); cursor: ew-resize; }
  .h-t { top: -7px; left: calc(50% - 6px); cursor: ns-resize; }
  .h-b { bottom: -7px; left: calc(50% - 6px); cursor: ns-resize; }
  .h-tl { left: -7px; top: -7px; cursor: nwse-resize; }
  .h-br { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .h-tr { right: -7px; top: -7px; cursor: nesw-resize; }
  .h-bl { left: -7px; bottom: -7px; cursor: nesw-resize; }

  /* Right-click menu */
  #ctx {
    position: fixed; display: none; min-width: 190px; background: #0c0c0c;
    border: 1px solid var(--line2); z-index: 80; box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  #ctx button {
    display: block; width: 100%; background: none; border: 0; color: var(--text);
    padding: 11px 16px; font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  #ctx button:hover { background: #1a1a1a; color: var(--hi); }

  /* Charts */
  .chart { overflow-x: auto; }
  .chart svg { max-width: 100%; height: auto; display: block; }
  .exportrow { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

  /* Notices */
  #toasts { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
  .toast { background: #0c0c0c; border: 1px solid #e5e5e5; padding: 12px 16px; min-width: 260px; box-shadow: 0 0 24px rgba(255,255,255,.08); animation: slide .3s ease; transition: opacity .6s; }
  .toast.out { opacity: 0; }
  .t-title { font-size: 12px; letter-spacing: .25em; color: #fff; font-weight: 700; }
  .t-msg { font-size: 13px; color: var(--mute); margin-top: 4px; }
  @keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  #lvlup { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 60; cursor: pointer; }
  #lvlup.show { display: grid; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .lu-box { text-align: center; border: 1px solid #e5e5e5; padding: 40px 64px; box-shadow: 0 0 60px rgba(255,255,255,.12); margin: 16px; }
  .lu-k { font-size: 12px; letter-spacing: .4em; color: var(--mute); }
  .lu-t { font-size: 48px; font-weight: 900; letter-spacing: .2em; margin: 10px 0; color: #fff; }
  .lu-l { letter-spacing: .2em; color: var(--mute); }

  /* ---------- Phone layout ---------- */
  @media (max-width: 820px) {
    .side { transform: translateX(-100%); transition: transform .25s ease; width: 84%; max-width: 300px; }
    body.side-open .side { transform: none; }
    .content { margin-left: 0; padding: 20px 16px 40px; }
    .menu { display: inline-block; }
    body.side-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 15; }
    .split { grid-template-columns: 1fr; }
    .title { font-size: 20px; }
    .big { font-size: 32px; }
    .rank { font-size: 28px; }
    .lu-box { padding: 28px 32px; }
    .lu-t { font-size: 36px; }
    .btn { padding: 10px 14px; }
    .day { min-height: 46px; }
    .widget-cal .day { min-height: 34px; }
    .board { min-height: 420px; }
    #toasts { left: 16px; right: 16px; top: 12px; }
    .toast { min-width: 0; }
  }
.grp{cursor:pointer;user-select:none}
.vbox{position:relative;background:#000;border:1px solid var(--line2);border-radius:8px;overflow:hidden;min-height:170px}
.vbox video,.vbox canvas{display:block;width:100%}.vbox canvas{position:absolute;inset:0;height:100%}.vbox video{filter:grayscale(1)}.mir{transform:scaleX(-1)}
#tvHud{position:absolute;left:12px;bottom:8px;pointer-events:none;text-shadow:0 2px 8px #000}#tvCnt{font:700 64px/1 Arial,sans-serif}
#tvState{position:absolute;right:10px;top:8px;background:#000a;padding:2px 10px;border-radius:99px;font-size:13px}
.tmsg{min-height:24px;font-weight:700;margin:8px 0}.tmsg:not(:empty){background:#f5f5f5;color:#070707;padding:6px 10px;border-radius:6px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;text-align:center}.tgrid>div{border:1px solid var(--line2);border-radius:6px;padding:6px}.tgrid b{display:block;font-size:22px}
.tgrid .wk{background:#f5f5f5;color:#070707}.tgrid .wk .meta{color:#070707}
</style>
</head>
<body>

<aside class="side" id="side"></aside>
<div class="scrim" onclick="toggleSide(false)"></div>

<main class="content">
  <button class="btn menu" onclick="toggleSide(true)">☰ Menu</button>
  <div id="view"></div>
</main>

<div id="ctx"></div>
<div id="toasts"></div>
<div id="lvlup" onclick="this.classList.remove('show')"></div>
<input type="file" id="dataIn" accept=".json,application/json" style="display:none" onchange="importData(this)">
<input type="file" id="boardIn" accept="image/*" style="display:none" onchange="onBoardFile(this)">
<input type="file" id="picInput" accept="image/*" style="display:none" onchange="uploadPic(this)">

<script>
// ---------- storage keys ----------
const KEY = 'growth-app-v1';            // progress, quests, planner
const PKEY = 'growth-app-profile-v1';   // profile name, picture and picture board
const SHADES = ['#161616', '#3a3a3a', '#6b6b6b', '#bdbdbd', '#f2f2f2'];
const LINE_COLORS = ['#f5f5f5', '#bdbdbd', '#8c8c8c', '#5a5a5a', '#e0e0e0', '#9a9a9a', '#777777', '#cccccc'];
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const MIN_CROP = 0.05;   // a picture can never be cropped below 5% of its size
const MIN_BOARD = 560;   // board height when empty (it grows as pictures are added)
const $ = id => document.getElementById(id);

// Ranks: name starts at this level
const RANKS = [
  [1, 'Rookie'], [5, 'Beginner'], [10, 'Apprentice'], [15, 'Adept'], [20, 'Skilled'],
  [25, 'Expert'], [30, 'Elite'], [35, 'Master'], [40, 'Champion'], [45, 'Legend'], [50, 'Mythic']
];

const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true">
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#f5f5f5" stroke-width="2.5"/>
  <path d="M32 46V20M20 32l12-12 12 12" fill="none" stroke="#f5f5f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 51h20" stroke="#f5f5f5" stroke-width="2" stroke-linecap="round" opacity=".45"/>
</svg>`;

// ---------- helpers ----------
function pad(n) { return String(n).padStart(2, '0'); }
function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const TODAY = () => key(new Date());
const uid = () => Math.random().toString(36).slice(2, 9);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- data ----------
function seed() {
  return {
    categories: [
      { id: 'academics', name: 'Academics', icon: '▣' },
      { id: 'physique', name: 'Physique', icon: '◉' },
      { id: 'athletics', name: 'Athletics', icon: '▲' }
    ],
    items: [
      { id: uid(), cat: 'academics', title: 'Example chapter 1', xp: 20, repeat: false },
      { id: uid(), cat: 'academics', title: 'Example chapter 2', xp: 20, repeat: false },
      { id: uid(), cat: 'physique', title: 'Push-ups 3 x 15', xp: 10, repeat: true },
      { id: uid(), cat: 'physique', title: 'Plank 60 seconds', xp: 10, repeat: true },
      { id: uid(), cat: 'athletics', title: 'Run 2 km without stopping', xp: 30, repeat: true },
      { id: uid(), cat: 'athletics', title: 'Skipping rope 100 jumps', xp: 15, repeat: true }
    ],
    log: [],
    plans: []
  };
}
function normalize(d) {
  d.categories = d.categories || [];
  d.items = d.items || [];
  d.log = d.log || [];
  d.plans = d.plans || [];
  d.sets = d.sets || [];
  d.gates = d.gates || {};
  if (typeof d.focus !== 'number') d.focus = -1;
  if (!d.trainMade) {
    d.trainMade = 1;
    if (!d.categories.some(c => c.id === 'training')) d.categories.push({ id: 'training', name: 'Training', icon: '✦' });
  }
  return d;
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  return normalize(s || seed());
}
function loadProfile() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PKEY)); } catch (e) {}
  p = p || {};
  p.name = p.name || 'Hunter';
  p.pic = p.pic || null;
  p.pics = Array.isArray(p.pics) ? p.pics : [];
  return p;
}

let S = load();
let P = loadProfile();
let view = 'status', curCat = null, calMonth = new Date(), selDay = TODAY(), graphMonth = new Date(), wMonth = new Date();
let selPic = null, drag = null, pendingPos = { x: 20, y: 20 };
let brandTaps = 0, brandTimer = null;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('STORAGE FULL', 'Could not save. Export a backup and free some space.'); }
}
function saveProfile() {
  try { localStorage.setItem(PKEY, JSON.stringify(P)); }
  catch (e) { toast('STORAGE FULL', 'Browser storage is full. Delete some pictures or export a backup.'); }
}

// ---------- XP, levels, ranks ----------
// XP needed to go from level lv to lv+1. It rises faster each level, so later levels take longer.
function need(lv) { return Math.round(100 * Math.pow(lv, 1.35)); }
function levelInfo(xp) {
  let lv = 1, rem = xp;
  while (rem >= need(lv)) { rem -= need(lv); lv++; }
  return { level: lv, into: rem, need: need(lv) };
}
function rankFor(lv) {
  let name = RANKS[0][1];
  RANKS.forEach(([min, n]) => { if (lv >= min) name = n; });
  return name;
}
function totalXP() { return S.log.reduce((a, l) => a + l.xp, 0); }
function catXP(id) { return S.log.filter(l => l.cat === id).reduce((a, l) => a + l.xp, 0); }
function isDone(it) {
  return it.repeat
    ? S.log.some(l => l.itemId === it.id && l.date === TODAY())
    : S.log.some(l => l.itemId === it.id);
}

// ---------- in-app notices ----------
function toast(title, msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="t-title">[ ${esc(title)} ]</div><div class="t-msg">${esc(msg || '')}</div>`;
  $('toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 3000);
  setTimeout(() => t.remove(), 3600);
}
function levelUp(lv) {
  const o = $('lvlup');
  o.innerHTML = `<div class="lu-box">
    <div class="lu-k">SYSTEM NOTICE</div>
    <div class="lu-t">LEVEL UP</div>
    <div class="lu-l">LV ${lv} · ${esc(rankFor(lv)).toUpperCase()}</div></div>`;
  o.classList.add('show');
  setTimeout(() => o.classList.remove('show'), 2600);
}

// ---------- navigation ----------
function setView(v, cat) {
  if (view === 'train' && v !== 'train') tStop();
  view = v;
  if (cat !== undefined) curCat = cat;
  selPic = null;
  toggleSide(false);
  renderAll();
}
function toggleSide(force) { document.body.classList.toggle('side-open', force); }
function pickDay(k) { selDay = k; renderAll(); }
function moveMonth(n) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1); renderAll(); }
function moveGraph(n) { graphMonth = new Date(graphMonth.getFullYear(), graphMonth.getMonth() + n, 1); renderAll(); }
function moveWidgetMonth(n) { wMonth = new Date(wMonth.getFullYear(), wMonth.getMonth() + n, 1); renderAll(); }

// ---------- hidden creator credit ----------
function brandTap() {
  brandTaps++;
  clearTimeout(brandTimer);
  brandTimer = setTimeout(() => brandTaps = 0, 1500);
  if (brandTaps >= 5) { brandTaps = 0; showCredit(); }
}
function showCredit() {
  const o = $('lvlup');
  o.innerHTML = `<div class="lu-box">
    <div class="lu-k">CREATOR</div>
    <div class="lu-t" style="font-size:36px">KARTHIK</div>
    <div class="lu-l">THE CREATOR OF THIS APP</div></div>`;
  o.classList.add('show');
  setTimeout(() => o.classList.remove('show'), 3500);
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); showCredit(); }
  if (e.key === 'Escape') hideCtx();
});

// ---------- backup: export and import ----------
function exportData() {
  const payload = { app: 'uprise', version: 6, exportedAt: new Date().toISOString(), profile: P, data: S };
  saveBlob(new Blob([JSON.stringify(payload)], { type: 'application/json' }), 'uprise-backup-' + TODAY() + '.json');
  toast('BACKUP EXPORTED', 'Your data was saved to a file');
}
function pickImport() { $('dataIn').click(); }
function importData(input) {
  const f = input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let o;
    try { o = JSON.parse(reader.result); } catch (e) { o = null; }
    if (!o || o.app !== 'uprise' || !o.data || !Array.isArray(o.data.categories)) {
      toast('INVALID FILE', 'This is not an Uprise backup');
      input.value = '';
      return;
    }
    if (!confirm('Restore this backup? It replaces the progress, profile and pictures on this device.')) {
      input.value = '';
      return;
    }
    P = Object.assign({ name: 'Hunter', pic: null, pics: [] }, o.profile || {});
    P.pics = Array.isArray(P.pics) ? P.pics : [];
    saveProfile();
    S = normalize(o.data);
    save();
    input.value = '';
    toast('BACKUP RESTORED', 'Your data is back');
    renderAll();
  };
  reader.readAsText(f);
}

// ---------- profile picture ----------
function avatarHTML(cls) {
  const c = cls || '';
  return P.pic
    ? `<img class="av ${c}" src="${P.pic}" alt="Profile picture">`
    : `<div class="av ph ${c}">◈</div>`;
}
function setName() {
  const n = prompt('Enter your name:', P.name);
  if (n === null || !n.trim()) return;
  P.name = n.trim().slice(0, 30);
  saveProfile();
  toast('PROFILE UPDATED', 'Name changed to ' + P.name);
  renderAll();
}
function pickPic() { $('picInput').click(); }
function uploadPic(input) {
  const f = input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const m = Math.min(img.width, img.height);
      const sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      canvas.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, size, size);
      P.pic = canvas.toDataURL('image/jpeg', 0.85);
      saveProfile();
      toast('PROFILE UPDATED', 'Picture saved');
      input.value = '';
      renderAll();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
function removePic() {
  if (!confirm('Remove your profile picture?')) return;
  P.pic = null;
  saveProfile();
  toast('PROFILE UPDATED', 'Picture removed');
  renderAll();
}

// ---------- picture board ----------
// Each picture keeps its original size (natW, natH), a display scale (s), a position on the
// board (x, y), how much is cropped from each side (l, t, r, b as fractions) and a stacking order (z).
function findPic(id) { return P.pics.find(p => p.id === id); }
function topZ() { return Math.max(0, ...P.pics.map(p => p.z || 0)); }
function picBottom(p) { return p.y + p.natH * p.s * (1 - p.t - p.b); }
function boardBottom() { return Math.max(0, ...P.pics.map(picBottom)); }
function boardHeight() { return Math.max(MIN_BOARD, Math.ceil(boardBottom()) + 160); }
function nextY() { return P.pics.length ? Math.ceil(boardBottom()) + 24 : 20; }
function fitBoard() { const b = $('board'); if (b) b.style.height = boardHeight() + 'px'; }

function picHTML(p) {
  const W = p.natW * p.s, H = p.natH * p.s;
  const fw = W * (1 - p.l - p.r), fh = H * (1 - p.t - p.b);
  const isSel = selPic === p.id;
  const handles = isSel
    ? ['tl', 't', 'tr', 'l', 'r', 'bl', 'b', 'br'].map(h => `<div class="hnd h-${h}" data-h="${h}"></div>`).join('')
    : '';
  return `<div class="pic${isSel ? ' sel' : ''}" id="pic-${p.id}" data-id="${p.id}"
      style="left:${p.x}px;top:${p.y}px;width:${fw}px;height:${fh}px;z-index:${p.z || 1}">
      <div class="crop"><img src="${p.src}" draggable="false"
        style="width:${W}px;height:${H}px;left:${-p.l * W}px;top:${-p.t * H}px"></div>
      ${handles}
    </div>`;
}
function refreshPic(id) {
  const p = findPic(id), el = $('pic-' + id);
  if (p && el) el.outerHTML = picHTML(p);
}
function boardHTML() {
  const pics = P.pics.map(picHTML).join('');
  const hint = P.pics.length ? '' :
    '<div class="board-hint">Right-click here to add a picture<br>(on a phone, press and hold)</div>';
  return pics + hint;
}

// Controls for the selected picture (size slider, fit, crop, delete)
function picTools() {
  const p = selPic && findPic(selPic);
  if (!p) return '<div class="meta" style="margin-top:14px">Click a picture to select it and show its controls.</div>';
  const pct = Math.round(p.s * 100);
  return `<div class="panel" style="margin-top:16px">
    <div class="head"><span>Selected picture</span>
      <span class="btnrow">
        <button class="btn" onclick="fitWidth()">Fit to board width</button>
        <button class="btn" onclick="resetCrop(selPic)">Reset crop</button>
        <button class="btn" onclick="bringFront(selPic)">Bring to front</button>
        <button class="btn danger" onclick="delPic(selPic)">Delete</button>
      </span></div>
    <div class="slider-row">
      <span class="label">Size</span>
      <input type="range" min="10" max="400" value="${pct}"
        oninput="setScale(this.value, false)" onchange="setScale(this.value, true)">
      <span class="meta" id="scaleVal" style="margin:0">${pct}%</span>
    </div>
    <div class="meta" style="margin-top:10px">Drag the slider to make the picture bigger or smaller. Drag the white handles on the picture to crop.</div>
  </div>`;
}
function renderTools() { const el = $('picTools'); if (el) el.innerHTML = picTools(); }

function setScale(v, save) {
  const p = findPic(selPic);
  if (!p) return;
  p.s = Math.max(0.1, Math.min(4, v / 100));
  const lbl = $('scaleVal');
  if (lbl) lbl.textContent = Math.round(p.s * 100) + '%';
  refreshPic(p.id);
  fitBoard();
  if (save) saveProfile();
}
function fitWidth() {
  const p = findPic(selPic);
  const board = $('board');
  if (!p || !board) return;
  const visibleNat = p.natW * (1 - p.l - p.r);
  const target = board.clientWidth - 24;
  p.s = Math.max(0.1, Math.min(4, target / visibleNat));
  p.x = 12;
  saveProfile();
  renderAll();
}

// Adding pictures
function onBoardFile(input) {
  const f = input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Shrink very large photos so many of them fit in browser storage
      const max = 1800;
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc);
      c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const pic = {
        id: uid(),
        src: c.toDataURL('image/jpeg', 0.85),
        natW: c.width, natH: c.height,
        s: Math.min(1, 320 / c.width),
        x: pendingPos.x, y: pendingPos.y,
        l: 0, t: 0, r: 0, b: 0,
        z: topZ() + 1
      };
      P.pics.push(pic);
      selPic = pic.id;
      saveProfile();
      input.value = '';
      renderAll();
      toast('PICTURE ADDED', 'Scroll down to see more. Drag edges to crop.');
    };
    img.onerror = () => toast('IMAGE ERROR', 'That file could not be opened');
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
function addBoardPic() {
  pendingPos = { x: 20, y: nextY() };
  $('boardIn').click();
}

// Picture actions
function resetCrop(id) {
  const p = findPic(id);
  if (!p) return;
  const W = p.natW * p.s, H = p.natH * p.s;
  p.x -= p.l * W; p.y -= p.t * H;
  p.l = p.t = p.r = p.b = 0;
  saveProfile(); renderAll();
}
function bringFront(id) {
  const p = findPic(id);
  if (!p) return;
  p.z = topZ() + 1;
  saveProfile(); renderAll();
}
function delPic(id) {
  if (!confirm('Delete this picture?')) return;
  P.pics = P.pics.filter(p => p.id !== id);
  if (selPic === id) selPic = null;
  saveProfile(); renderAll();
}

// Mouse and touch: the middle moves a picture, an edge or corner crops that side
function onBoardDown(e) {
  if (e.button === 2) return;
  const frame = e.target.closest('.pic');
  if (!frame) {
    if (selPic) {
      const prev = selPic;
      selPic = null;
      refreshPic(prev);
      renderTools();
    }
    return;
  }
  const id = frame.dataset.id;
  const p = findPic(id);
  if (!p) return;
  e.preventDefault();
  if (selPic !== id) {
    const prev = selPic;
    selPic = id;
    p.z = topZ() + 1;
    if (prev) refreshPic(prev);
    refreshPic(id);
    renderTools();
  }
  const hnd = e.target.closest('.hnd');
  drag = {
    id,
    mode: hnd ? hnd.dataset.h : 'move',
    sx: e.clientX, sy: e.clientY,
    snap: JSON.parse(JSON.stringify(p))
  };
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragEnd);
}
function onDragMove(e) {
  if (!drag) return;
  const p = findPic(drag.id);
  if (!p) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  const sn = drag.snap;
  const W0 = sn.natW * sn.s, H0 = sn.natH * sn.s;

  if (drag.mode === 'move') {
    p.x = Math.max(0, sn.x + dx);
    p.y = Math.max(0, sn.y + dy);
  } else {
    const m = drag.mode;
    let l = sn.l, r = sn.r, t = sn.t, b = sn.b, x = sn.x, y = sn.y;
    if (m.includes('l')) {
      const nl = Math.min(Math.max(sn.l + dx / W0, 0), 1 - sn.r - MIN_CROP);
      x = sn.x + (nl - sn.l) * W0;
      l = nl;
    }
    if (m.includes('r')) {
      r = Math.min(Math.max(sn.r - dx / W0, 0), 1 - sn.l - MIN_CROP);
    }
    if (m.includes('t')) {
      const nt = Math.min(Math.max(sn.t + dy / H0, 0), 1 - sn.b - MIN_CROP);
      y = sn.y + (nt - sn.t) * H0;
      t = nt;
    }
    if (m.includes('b')) {
      b = Math.min(Math.max(sn.b - dy / H0, 0), 1 - sn.t - MIN_CROP);
    }
    p.l = l; p.r = r; p.t = t; p.b = b; p.x = Math.max(0, x); p.y = Math.max(0, y);
  }
  refreshPic(drag.id);
  fitBoard();
}
function onDragEnd() {
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragEnd);
  if (drag) saveProfile();
  drag = null;
}

// Right-click menu (press and hold on phones)
function showCtx(x, y, items) {
  const c = $('ctx');
  c.innerHTML = items.map((it, i) => `<button data-i="${i}">${esc(it.label)}</button>`).join('');
  c.querySelectorAll('button').forEach((b, i) => {
    b.onclick = () => { hideCtx(); items[i].run(); };
  });
  c.style.display = 'block';
  const w = c.offsetWidth, h = c.offsetHeight;
  c.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  c.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
}
function hideCtx() { $('ctx').style.display = 'none'; }

// ---------- resets ----------
function resetProgress() {
  if (!confirm('Reset progress? XP, completed quests and planner entries will be cleared. Your name, pictures, categories and quests are kept.')) return;
  S.log = [];
  S.plans = [];
  S.sets = [];
  S.gates = {};
  save();
  view = 'status';
  toast('PROGRESS RESET', 'XP and completions cleared');
  renderAll();
}
function resetAll() {
  if (!confirm('Reset ALL? This erases your name, profile picture, picture board, progress, categories and quests.')) return;
  if (prompt('Type RESET (in capitals) to confirm:') !== 'RESET') return;
  S = normalize(seed());
  P = { name: 'Hunter', pic: null, pics: [] };
  save();
  saveProfile();
  curCat = null;
  selPic = null;
  view = 'status';
  toast('SYSTEM RESET', 'Everything returned to the starting state');
  renderAll();
}

// ---------- categories ----------
function addCategory() {
  const n = prompt('Category name (e.g. Music, Reading):');
  if (!n || !n.trim()) return;
  const c = { id: uid(), name: n.trim(), icon: '◆' };
  S.categories.push(c);
  save();
  setView('cat', c.id);
}
function renameCat(id) {
  const c = S.categories.find(x => x.id === id);
  const n = prompt('Rename category:', c.name);
  if (n && n.trim()) { c.name = n.trim(); save(); renderAll(); }
}
function deleteCat(id) {
  if (!confirm('Delete this category and all its quests and progress?')) return;
  S.categories = S.categories.filter(c => c.id !== id);
  S.items = S.items.filter(i => i.cat !== id);
  S.log = S.log.filter(l => l.cat !== id);
  curCat = null; view = 'status';
  save(); renderAll();
}

// ---------- quests ----------
function addQuest() {
  const t = $('qTitle').value.trim();
  if (!t) return;
  const xp = Math.max(1, parseInt($('qXp').value) || 10);
  const repeat = $('qRep').checked;
  S.items.push({ id: uid(), cat: curCat, title: t, xp, repeat });
  save(); renderAll();
}
function editQuest(id) {
  const it = S.items.find(i => i.id === id);
  if (!it) return;
  const t = prompt('Quest name:', it.title);
  if (t === null) return;
  const x = prompt('XP reward:', it.xp);
  if (x === null) return;
  it.title = t.trim() || it.title;
  it.xp = Math.max(1, parseInt(x) || it.xp);
  save(); renderAll();
}
function delQuest(id) {
  if (!confirm('Delete this quest? Its XP will be removed too.')) return;
  S.items = S.items.filter(i => i.id !== id);
  S.log = S.log.filter(l => l.itemId !== id);
  save(); renderAll();
}
function toggleQuest(id) {
  const it = S.items.find(i => i.id === id);
  if (!it) return;
  const before = levelInfo(totalXP()).level;
  if (isDone(it)) {
    S.log = S.log.filter(l => !(l.itemId === id && (!it.repeat || l.date === TODAY())));
    save(); renderAll();
    return;
  }
  S.log.push({ date: TODAY(), itemId: id, cat: it.cat, xp: it.xp });
  save();
  toast('QUEST COMPLETE', it.title + '  ·  +' + it.xp + ' XP');
  const after = levelInfo(totalXP()).level;
  if (after > before) levelUp(after);
  renderAll();
}

// ---------- chart builders (SVG text, used for display and download) ----------
function radarSVG() {
  const cats = S.categories, n = cats.length;
  const W = 420, H = 420, cx = 210, cy = 210, R = 130;
  const fg = '#f5f5f5', mu = '#8c8c8c', grid = '#2a2a2a';
  const head = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="#0f0f0f"/>
    <text x="20" y="34" fill="${fg}" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">XP BALANCE</text>`;
  if (n < 3) {
    return head + `<text x="210" y="220" text-anchor="middle" fill="${mu}" font-family="Arial" font-size="14">Add at least 3 categories to see this chart</text></svg>`;
  }
  const maxV = Math.max(1, ...cats.map(c => catXP(c.id)));
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  let s = head;
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const pts = cats.map((_, i) => pt(i, R * f).join(',')).join(' ');
    s += `<polygon points="${pts}" fill="none" stroke="${grid}" stroke-width="1"/>`;
  });
  cats.forEach((c, i) => {
    const [x, y] = pt(i, R);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${grid}"/>`;
  });
  const data = cats.map((c, i) => pt(i, R * catXP(c.id) / maxV).join(',')).join(' ');
  s += `<polygon points="${data}" fill="rgba(245,245,245,.18)" stroke="${fg}" stroke-width="2"/>`;
  cats.forEach((c, i) => {
    const v = catXP(c.id);
    const [px, py] = pt(i, R * v / maxV);
    s += `<circle cx="${px}" cy="${py}" r="4" fill="${fg}"/>`;
    const [lx, ly] = pt(i, R + 34);
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${fg}" font-family="Arial" font-size="13">${esc(c.name.slice(0, 12))}</text>`;
    s += `<text x="${lx}" y="${ly + 15}" text-anchor="middle" fill="${mu}" font-family="Arial" font-size="11">${v} XP</text>`;
  });
  return s + '</svg>';
}

function graphSVG() {
  const y = graphMonth.getFullYear(), m = graphMonth.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const W = 720, H = 380, L = 56, R = 20, T = 70, B = 44;
  const pw = W - L - R, ph = H - T - B;
  const series = S.categories.map(c => {
    const arr = new Array(days).fill(0);
    S.log.forEach(l => {
      if (l.cat !== c.id) return;
      const p = l.date.split('-').map(Number);
      if (p[0] === y && p[1] === m + 1) arr[p[2] - 1] += l.xp;
    });
    return arr;
  });
  const maxV = Math.max(10, ...series.map(a => Math.max(...a)));
  const X = i => L + (i / (days - 1)) * pw;
  const Y = v => T + ph - (v / maxV) * ph;
  const monthName = graphMonth.toLocaleString('default', { month: 'long', year: 'numeric' }).toUpperCase();

  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="#0f0f0f"/>
    <text x="20" y="34" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">MONTHLY XP · ${esc(monthName)}</text>`;

  for (let g = 0; g <= 4; g++) {
    const v = Math.round(maxV * g / 4), yy = Y(v);
    s += `<line x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}" stroke="#2a2a2a"/>`;
    s += `<text x="${L - 8}" y="${yy + 4}" text-anchor="end" fill="#8c8c8c" font-family="Arial" font-size="11">${v}</text>`;
  }
  for (let d = 1; d <= days; d += 5) {
    s += `<text x="${X(d - 1)}" y="${H - 16}" text-anchor="middle" fill="#8c8c8c" font-family="Arial" font-size="11">${d}</text>`;
  }
  S.categories.forEach((c, ci) => {
    const pts = series[ci].map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${LINE_COLORS[ci % LINE_COLORS.length]}" stroke-width="2.2" stroke-linejoin="round"/>`;
  });
  S.categories.forEach((c, ci) => {
    const x = 20 + ci * Math.min(150, 680 / S.categories.length);
    s += `<rect x="${x}" y="50" width="12" height="12" fill="${LINE_COLORS[ci % LINE_COLORS.length]}"/>`;
    s += `<text x="${x + 18}" y="60" fill="#bdbdbd" font-family="Arial" font-size="12">${esc(c.name.slice(0, 14))}</text>`;
  });
  return s + '</svg>';
}

function heatSVG(title, filter) {
  const today = new Date();
  const start = new Date(today);
  start.setDate(today.getDate() - (11 * 7 + today.getDay()));
  const n = 11 * 7 + today.getDay() + 1;
  const counts = {};
  S.log.filter(filter).forEach(l => counts[l.date] = (counts[l.date] || 0) + 1);

  const cs = 15, cols = Math.ceil(n / 7);
  const W = 16 + cols * cs + 16, H = 56 + 7 * cs + 40;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="#0f0f0f"/>
    <text x="16" y="34" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">${esc(title).toUpperCase()}</text>`;
  for (let i = 0; i < n; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = key(d), c = counts[k] || 0;
    const col = Math.floor(i / 7), row = i % 7;
    s += `<rect x="${16 + col * cs}" y="${56 + row * cs}" width="12" height="12" rx="2" fill="${SHADES[Math.min(c, 4)]}"><title>${k}: ${c} completed</title></rect>`;
  }
  const ly = 56 + 7 * cs + 20;
  s += `<text x="16" y="${ly + 9}" fill="#8c8c8c" font-family="Arial" font-size="11">Less</text>`;
  SHADES.forEach((c, i) => { s += `<rect x="${50 + i * 16}" y="${ly}" width="12" height="12" rx="2" fill="${c}"/>`; });
  s += `<text x="${50 + SHADES.length * 16 + 4}" y="${ly + 9}" fill="#8c8c8c" font-family="Arial" font-size="11">More</text>`;
  return s + '</svg>';
}

function getChartSVG(id) {
  if (id === 'radar') return radarSVG();
  if (id === 'graph') return graphSVG();
  if (id === 'heat-all') return heatSVG('Overall', () => true);
  if (id.startsWith('heat-')) {
    const cid = id.slice(5);
    const c = S.categories.find(x => x.id === cid);
    return heatSVG(c ? c.name : 'Category', l => l.cat === cid);
  }
  return moreChart(id);
}

// ---------- chart download (PNG or PDF) ----------
function svgToCanvas(svg, w, h) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = 2;
      const c = document.createElement('canvas');
      c.width = w * scale; c.height = h * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c);
    };
    img.onerror = () => rej(new Error('Could not draw the chart'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function loadJsPDF() {
  return new Promise((res, rej) => {
    if (window.jspdf) return res();
    const s = document.createElement('script');
    s.src = JSPDF_URL;
    s.onload = () => res();
    s.onerror = () => rej(new Error('PDF library failed to load. Check your internet connection.'));
    document.head.appendChild(s);
  });
}
async function downloadChart(id) {
  try {
    const fmt = $('fmt-' + id).value;
    const svg = getChartSVG(id);
    const m = svg.match(/width="(\d+)" height="(\d+)"/);
    const w = +m[1], h = +m[2];
    const canvas = await svgToCanvas(svg, w, h);
    const name = 'uprise-' + id + '-' + TODAY();
    if (fmt === 'png') {
      canvas.toBlob(b => saveBlob(b, name + '.png'), 'image/png');
    } else {
      await loadJsPDF();
      const pdf = new window.jspdf.jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit: 'px', format: [w, h] });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
      pdf.save(name + '.pdf');
    }
    toast('DOWNLOADED', fmt.toUpperCase() + ' saved');
  } catch (e) {
    toast('DOWNLOAD FAILED', e.message);
  }
}
function exportRow(id) {
  return `<div class="exportrow">
    <select id="fmt-${id}" class="sel">
      <option value="png">PNG image</option>
      <option value="pdf">PDF document</option>
    </select>
    <button class="btn solid" onclick="downloadChart('${id}')">Download</button>
  </div>`;
}

const angle=(a,b,k)=>{const r=Math.atan2(k.y-b.y,k.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x),d=Math.abs(r*180/Math.PI);return d>180?360-d:d};

const tBeep=(f=660,d=.12)=>{try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}};
function tUI(){const c=$('tvCnt');if(!c)return;const e=EX[CAM.ex];c.textContent=e.hold?Math.floor(CAM.hold/1e3):CAM.reps;$('tvGoal').textContent=CAM.goal?'of '+CAM.goal+(e.hold?' s':''):'';if(CAM.run)$('tvState').textContent=CAM.done?'Set complete':e.hold?'Holding':CAM.st==='wait'?'Get in position':CAM.st==='flex'?'Push back up':'Go'}
function tReset(){Object.assign(CAM,{side:null,conf:0,armAt:performance.now()+5000,reps:0,hold:0,st:'wait',A:null,tLeave:0,durs:[],flags:0,bad:false,done:false,lastTick:0,lastOk:0});tUI()}
function tPlus(){if(!CAM.done&&!EX[CAM.ex].hold){CAM.reps++;tBeep();tUI();if(CAM.goal&&CAM.reps>=CAM.goal)tFinish()}}
function tFinish(){if(CAM.done)return;CAM.done=true;const e=EX[CAM.ex],val=e.hold?Math.round(CAM.hold/1e3):CAM.reps;
 if(val>0){S.sets.push({d:new Date().toISOString(),day:TODAY(),ex:CAM.ex,v:val,hold:!!e.hold,tempo:CAM.durs.length?Math.round(CAM.durs.reduce((a,b)=>a+b,0)/CAM.durs.length/100)/10:0,flags:CAM.flags});
  const xp=Math.round(val*mult());award(xp,e.n+' '+val+(e.hold?' s':' reps'));let m='+'+xp+' XP. ';
  GATES.forEach((g,i)=>{const st=gs(i);if(gOpen(g)&&!st.done&&g[3][st.s].split('|')[3]===CAM.ex)m+=glog(i,val)});
  save();toast('SET COMPLETE',m);renderSide()}
 tBeep(880,.3);tUI()}
function tRep(now){const d=CAM.tLeave?now-CAM.tLeave:(now-CAM.tFlex)*2;CAM.tLeave=0;if(d<350){tw('Too fast to count ('+Math.round(d)+' ms). Move at a steady pace.');return}
 CAM.durs.push(d);CAM.reps++;tBeep();if(d<900)tw('Slow down. Control the movement.');if(CAM.bad){CAM.flags++;CAM.bad=false}tUI();if(CAM.goal&&CAM.reps>=CAM.goal)tFinish()}
function tUpdate(lm,v){
 const W=v.videoWidth,H=v.videoHeight,e=EX[CAM.ex],now=performance.now();
 if(now<CAM.armAt){tw('Get in position: '+Math.ceil((CAM.armAt-now)/1e3));return}
 const vis=s=>Object.values(IDX).reduce((a,k)=>a+lm[k[s]].visibility,0);if(CAM.side===null||CAM.st==='wait')CAM.side=vis(0)>=vis(1)?0:1;const s=CAM.side;
 const pt=n=>({x:lm[IDX[n][s]].x*W,y:lm[IDX[n][s]].y*H}),line=angle(pt('shoulder'),pt('hip'),pt('ankle'));
 if(e.hold){const sh=pt('shoulder'),hp=pt('hip'),an=pt('ankle'),wr=pt('wrist');let ok;
  if(CAM.ex==='handstand'){ok=an.y<hp.y&&hp.y<sh.y&&sh.y<wr.y;if(ok&&line<160)tw('Stack your hips over your shoulders')}
  else{ok=line>160&&Math.abs(sh.y-an.y)<.45*Math.abs(sh.x-an.x);if(!ok&&line<160)tw('Keep your hips in line')}
  if(ok)CAM.lastOk=now;if(CAM.lastTick&&now-CAM.lastOk<700)CAM.hold+=now-CAM.lastTick;CAM.lastTick=now;tUI();if(CAM.goal&&CAM.hold/1e3>=CAM.goal)tFinish();return}
 if(e.j.some(n=>lm[IDX[n][s]].visibility<.6)){tw('A joint is hidden. Adjust the camera so your whole side is visible.');return}
 const a=angle(pt(e.j[0]),pt(e.j[1]),pt(e.j[2]));
 if(CAM.A!=null&&Math.abs(a-CAM.A)>50){CAM.A=CAM.A*.8+a*.2;return}
 CAM.A=CAM.A==null?a:CAM.A*.7+a*.3;
 const go=c=>{if(!c){CAM.conf=0;return false}if(!CAM.conf)CAM.conf=now;return now-CAM.conf>=120},A=CAM.A;
 if(CAM.st==='wait'){if(go(A>=e.hi)){CAM.st='ext';CAM.conf=0;tUI()}else if(A<e.hi)tw('Get into the starting position')}
 else if(CAM.st==='ext'){if(A>=e.hi)CAM.tLeave=0;else if(A<e.hi-10&&!CAM.tLeave)CAM.tLeave=now;if(go(A<=e.lo)){CAM.st='flex';CAM.conf=0;CAM.tFlex=now;tUI()}}
 else{if(CAM.ex==='pushup'&&line<150){tw('Keep your body in one line');CAM.bad=true}if(go(A>=e.hi)){CAM.st='ext';CAM.conf=0;tRep(now)}}}
function tLoop(){
 const v=$('tvV'),c=$('tvC');if(!CAM.run||!v||!c){CAM.loop=false;return}
 CAM.loop=true;
 if(CAM.du&&v.readyState>=2&&v.currentTime!==CAM.lastT){CAM.lastT=v.currentTime;
  const r=CAM.pl.detectForVideo(v,performance.now()),lm=r.landmarks&&r.landmarks[0];c.getContext('2d').clearRect(0,0,c.width,c.height);
  if(lm){CAM.miss=0;CAM.du.drawConnectors(lm,CAM.mp.PoseLandmarker.POSE_CONNECTIONS,{color:'#ffffff',lineWidth:4});CAM.du.drawLandmarks(lm,{color:'#ffffff',radius:3});if(!CAM.done)tUpdate(lm,v)}
  else{tw('I cannot see you. Step back so your whole body is in frame.');if(++CAM.miss>20){CAM.st='wait';CAM.A=null;CAM.tLeave=0;CAM.conf=0}}}
 const m=$('tvMsg');if(m)m.textContent=performance.now()-CAM.WT<1500?CAM.W:'';
 requestAnimationFrame(tLoop)}
function tAttach(){const v=$('tvV'),c=$('tvC');if(!v||!CAM.stream)return;v.srcObject=CAM.stream;v.play().then(()=>{c.width=v.videoWidth;c.height=v.videoHeight;CAM.du=new CAM.mp.DrawingUtils(c.getContext('2d'))}).catch(()=>{});const f=CAM.face==='user'?'add':'remove';v.classList[f]('mir');c.classList[f]('mir')}
function tStop(){CAM.run=false;if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;CAM.du=null}
async function tStart(){
 const b=$('tvGo');if(b)b.disabled=true;$('tvMsg').textContent='Loading the pose model. This takes a few seconds the first time.';
 try{
  if(!CAM.pl){CAM.mp=await import(MPU);const f=await CAM.mp.FilesetResolver.forVisionTasks(MPU+'/wasm');
   const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.6,minPosePresenceConfidence:.6,minTrackingConfidence:.6});
   try{CAM.pl=await CAM.mp.PoseLandmarker.createFromOptions(f,o('GPU'))}catch(e){CAM.pl=await CAM.mp.PoseLandmarker.createFromOptions(f,o('CPU'))}}
  if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());
  CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.face,width:{ideal:960},height:{ideal:720}},audio:false});
  if(view!=='train'){tStop();return}
  tAttach();CAM.run=true;$('tvMsg').textContent='';$('tvGo').textContent='Restart camera';tReset();if(!CAM.loop)requestAnimationFrame(tLoop);
 }catch(e){const m=$('tvMsg');if(m)m.textContent=e&&e.name==='NotAllowedError'?'Camera blocked. Allow camera access in your browser settings and try again.':e&&e.name==='NotFoundError'?'No camera found on this device.':'Could not start: '+(e&&e.message||e)+'. The camera needs https or localhost and an internet connection.'}
 if($('tvGo'))$('tvGo').disabled=false}
function trainView(){
 return `<div class="title">Train</div><div class="sub">Your camera counts reps and holds. Every set earns XP, grows your stats and clears gate steps.</div>
 <div class="panel"><div class="vbox"><video id="tvV" playsinline muted></video><canvas id="tvC"></canvas><div id="tvState">Camera off</div><div id="tvHud"><div id="tvCnt">0</div><div id="tvGoal" class="meta"></div></div></div>
 <div id="tvMsg" class="tmsg" role="status"></div>
 <div class="btnrow" style="margin-bottom:10px"><select id="tvEx" class="sel" onchange="CAM.ex=this.value;tReset()">${Object.keys(EX).map(k=>`<option value="${k}"${k===CAM.ex?' selected':''}>${EX[k].n}</option>`).join('')}</select><input id="tvGl" type="number" min="0" placeholder="Goal (reps or seconds)" value="${CAM.goal||''}" oninput="CAM.goal=+this.value||0;tUI()" style="max-width:210px"></div>
 <div class="btnrow"><button class="btn solid" id="tvGo" onclick="tStart()">Start camera</button><button class="btn" onclick="CAM.face=CAM.face==='user'?'environment':'user';if(CAM.run)tStart()">Flip camera</button><button class="btn" onclick="tReset()">New set</button><button class="btn" onclick="tFinish()">Finish set</button><button class="btn" onclick="tPlus()">Manual +1</button></div>
 <div class="meta" style="margin-top:10px">Put the camera at your side, about 2 m away, whole body in frame.</div></div>
 <div class="panel"><div class="head"><span>Stats</span><span class="meta">XP bonus x${mult().toFixed(2)} · streak ${streak()}</span></div>${statGrid()}<div class="meta">Highlighted stat is your weak point${S.focus>=0?' for '+esc(GATES[S.focus][0]):''}.</div></div>`}

/* extra charts */
const FG='#f5f5f5',MU='#8c8c8c',GR='#2a2a2a';
const svgOpen=(w,h,t)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#0f0f0f"/><text x="20" y="34" fill="${FG}" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">${esc(t).toUpperCase()}</text>`;
const noData=(w,h,t)=>svgOpen(w,h,t)+`<text x="${w/2}" y="${h/2+8}" text-anchor="middle" fill="${MU}" font-family="Arial" font-size="14">No data yet. Complete quests or training sets.</text></svg>`;
function weekStarts(n){const a=[],d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(d.getDate()-i*7);a.push(s)}return a}
function wkOf(date,ws){const t=new Date(date+'T00:00:00').getTime();for(let i=ws.length-1;i>=0;i--)if(t>=ws[i].getTime())return t<ws[i].getTime()+6048e5?i:-1;return -1}
const wkLabels=ws=>ws.map(d=>pad(d.getMonth()+1)+'/'+pad(d.getDate()));
function lineSVG(title,labels,series){
 const W=720,H=360,L=56,R=20,TT=76,B=44,pw=W-L-R,ph=H-TT-B,n=labels.length,mx=Math.max(...series.flatMap(x=>x.v),0);
 if(!mx)return noData(W,H,title);let s=svgOpen(W,H,title);
 for(let g=0;g<=4;g++){const y=TT+ph-ph*g/4;s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${GR}"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="${MU}" font-family="Arial" font-size="11">${Math.round(mx*g/4*10)/10}</text>`}
 const X=i=>L+(n>1?i/(n-1)*pw:pw/2);
 labels.forEach((l,i)=>{if(i%Math.ceil(n/12)===0)s+=`<text x="${X(i)}" y="${H-16}" text-anchor="middle" fill="${MU}" font-family="Arial" font-size="11">${esc(l)}</text>`});
 series.forEach((x,k)=>{const c=LINE_COLORS[k%LINE_COLORS.length],lx=20+k*Math.min(150,680/series.length);
  s+=`<polyline points="${x.v.map((v,i)=>X(i).toFixed(1)+','+(TT+ph-v/mx*ph).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/><rect x="${lx}" y="52" width="12" height="12" fill="${c}"/><text x="${lx+18}" y="62" fill="#bdbdbd" font-family="Arial" font-size="12">${esc(x.name.slice(0,14))}</text>`});
 return s+'</svg>'}
function barSVG(title,labels,vals){
 const W=720,H=340,L=56,R=20,TT=56,B=44,pw=W-L-R,ph=H-TT-B,n=labels.length,mx=Math.max(...vals,0);
 if(!mx)return noData(W,H,title);let s=svgOpen(W,H,title);
 for(let g=0;g<=4;g++){const y=TT+ph-ph*g/4;s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${GR}"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="${MU}" font-family="Arial" font-size="11">${Math.round(mx*g/4)}</text>`}
 const bw=pw/n;vals.forEach((v,i)=>{const h=v/mx*ph;s+=`<rect x="${L+i*bw+bw*.15}" y="${TT+ph-h}" width="${bw*.7}" height="${h}" fill="${FG}"/><text x="${L+i*bw+bw/2}" y="${H-16}" text-anchor="middle" fill="${MU}" font-family="Arial" font-size="10">${esc(labels[i])}</text>`});
 return s+'</svg>'}
function hbarSVG(title,rows,max){
 const W=720,H=80+rows.length*34;if(!rows.length)return noData(W,300,title);let s=svgOpen(W,H,title);
 rows.forEach((r,i)=>{const y=60+i*34,w=Math.max(2,500*Math.min(1,r[1]/max(r)));s+=`<text x="20" y="${y+16}" fill="#bdbdbd" font-family="Arial" font-size="12">${esc(r[0].slice(0,22))}</text><rect x="180" y="${y+4}" width="${w}" height="16" fill="${FG}"/><text x="${186+w}" y="${y+17}" fill="${MU}" font-family="Arial" font-size="11">${esc(r[2])}</text>`});
 return s+'</svg>'}
function radar2(title,names,vals){
 const W=420,H=420,cx=210,cy=210,R=130,n=names.length,mx=Math.max(1,...vals),ag=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+r*Math.cos(ag(i)),cy+r*Math.sin(ag(i))];
 let s=svgOpen(W,H,title);[.25,.5,.75,1].forEach(f=>{s+=`<polygon points="${names.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="${GR}"/>`});
 names.forEach((m,i)=>{const[x,y]=pt(i,R),[lx,ly]=pt(i,R+34);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${GR}"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${FG}" font-family="Arial" font-size="13">${esc(m)}</text><text x="${lx}" y="${ly+15}" text-anchor="middle" fill="${MU}" font-family="Arial" font-size="11">${vals[i]}</text>`});
 return s+`<polygon points="${vals.map((v,i)=>pt(i,R*v/mx).join(',')).join(' ')}" fill="rgba(245,245,245,.18)" stroke="${FG}" stroke-width="2"/></svg>`}
function moreChart(id){
 const ws=weekStarts(12),lb=wkLabels(ws);
 if(id==='cum'){const days=[];for(let i=89;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(key(d))}let base=0;S.log.forEach(l=>{if(l.date<days[0])base+=l.xp});const dx={};S.log.forEach(l=>dx[l.date]=(dx[l.date]||0)+l.xp);let c=base;return lineSVG('Cumulative XP, last 90 days',days.map(d=>d.slice(5)),[{name:'Total XP',v:days.map(d=>c+=dx[d]||0)}])}
 if(id==='wxp'){const v=ws.map(()=>0);S.log.forEach(l=>{const i=wkOf(l.date,ws);if(i>=0)v[i]+=l.xp});return barSVG('XP per week',lb,v)}
 if(id==='rstat'){const st=stats();return radar2('Training stats',Object.keys(st),Object.values(st))}
 if(id==='reps'){const w8=ws.slice(-8),ser=Object.keys(EX).map(k=>({name:EX[k].n,v:w8.map(()=>0)}));S.sets.forEach(h=>{const i=wkOf(h.day,w8),k=Object.keys(EX).indexOf(h.ex);if(i>=0&&k>=0)ser[k].v[i]+=h.v});return lineSVG('Weekly volume by exercise (reps or seconds)',wkLabels(w8),ser.filter(x=>x.v.some(a=>a>0)))}
 if(id==='vol'){const v=ws.map(()=>0);S.sets.forEach(h=>{const i=wkOf(h.day,ws);if(i>=0)v[i]+=h.hold?h.v/2:h.v});return barSVG('Training volume per week',lb,v.map(Math.round))}
 if(id==='form'){const t=ws.map(()=>[]),f=ws.map(()=>[]);S.sets.forEach(h=>{const i=wkOf(h.day,ws);if(i>=0&&!h.hold){if(h.tempo)t[i].push(h.tempo);f[i].push(h.flags||0)}});const av=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0;return lineSVG('Tempo and form',lb,[{name:'Avg s per rep',v:t.map(av)},{name:'Form flags per set',v:f.map(av)}])}
 if(id==='pb'){const r=Object.keys(EX).map(k=>{const m=Math.max(0,...S.sets.filter(h=>h.ex===k).map(h=>h.v));return[EX[k].n,m,m+(EX[k].hold?' s':' reps')]}).filter(x=>x[1]>0);return hbarSVG('Personal bests',r,()=>Math.max(...r.map(x=>x[1])))}
 if(id==='gates'){const r=GATES.map((g,i)=>[g[0],gs(i).done?g[3].length:gs(i).s,(gs(i).done?g[3].length:gs(i).s)+'/'+g[3].length,g[3].length]);return hbarSVG('Gate progress (steps cleared)',r.filter(x=>x[1]>0||true),x=>x[3])}
 if(id==='sets-heat')return heatSVG('Training days',l=>l.set);
 return ''}
const chartPanel=(t,id,extra)=>`<div class="panel"><div class="head"><span>${t}</span>${extra||''}</div><div class="chart">${moreChart(id)}</div>${exportRow(id)}</div>`;
function tchartsView(){return `<div class="title">Training charts</div><div class="sub">Stats, volume, form and skill progress</div><div class="stack">${chartPanel('Stats','rstat')}${chartPanel('Volume per week','vol')}${chartPanel('Volume by exercise','reps')}${chartPanel('Tempo and form','form')}${chartPanel('Personal bests','pb')}${chartPanel('Gate progress','gates')}${chartPanel('Training days','sets-heat')}</div>`}

/* sidebar menus */
const GROUPS=[['over','OVERVIEW',[['◎','Status','status'],['◫','Widget','widget']]],['train','TRAINING',[['▲','Train','train'],['◈','Skill gates','gates'],['◬','Training charts','tcharts']]],['prog','PROGRESS',[['◬','XP charts','charts'],['▩','Heatmap','heat']]],['plan','PLAN',[['▦','Planner','planner']]],['sys','SYSTEM',[['⚙','Settings','settings']]]];
let openG={};try{openG=JSON.parse(localStorage.getItem('uprise-ui'))||{}}catch(e){}
function toggleGroup(id){openG[id]=openG[id]===false;try{localStorage.setItem('uprise-ui',JSON.stringify(openG))}catch(e){}renderSide()}

// ---------- rendering ----------
function renderSide() {
  const li = levelInfo(totalXP());
  const nav = (icon, label, onclick, active) =>
    `<button class="nav ${active ? 'on' : ''}" onclick="${onclick}"><span class="ico">${icon}</span>${esc(label)}</button>`;
  const grp = (id, name, items) => {
    const open = items.some(x => x.on) || openG[id] !== false;
    return `<div class="sect grp" onclick="toggleGroup('${id}')">${open ? '▾' : '▸'} ${name}</div>${open ? items.map(x => x.h).join('') : ''}`;
  };
  $('side').innerHTML = `
    <div class="brand" onclick="brandTap()">
      <div class="logo">${LOGO}
        <div class="wordmark">UPRISE<small>GROWTH INTERFACE</small></div>
      </div>
    </div>
    <div class="player">
      ${avatarHTML()}
      <div><div class="pname">${esc(P.name)}</div>
        <div class="meta">LV ${li.level} · ${esc(rankFor(li.level)).toUpperCase()}</div></div>
    </div>
    ${GROUPS.map(([id, name, its]) => grp(id, name, its.map(([ic, l, v]) => ({ on: view === v, h: nav(ic, l, `setView('${v}')`, view === v) })))).join('')}
    ${grp('cats', 'CATEGORIES', S.categories.map(c => { const on = view === 'cat' && curCat === c.id; return { on, h: nav(c.icon, c.name, `setView('cat','${c.id}')`, on) }; }))}
    <button class="side-add" onclick="addCategory()">+ New category</button>`;
}

function viewHTML() {
  switch (view) {
    case 'cat': return catView();
    case 'train': return trainView();
    case 'gates': return gatesView();
    case 'tcharts': return tchartsView();
    case 'widget': return widgetView();
    case 'charts': return chartsView();
    case 'heat': return heatView();
    case 'planner': return plannerView();
    case 'settings': return settingsView();
    default: return statusView();
  }
}

function renderAll() {
  hideCtx();
  renderSide();
  $('view').innerHTML = viewHTML();
  if (view === 'train') { tAttach(); tUI(); }
}

// ---------- board events (attached once; the page content is re-drawn often) ----------
$('view').addEventListener('pointerdown', e => {
  if (e.target.closest('#board')) onBoardDown(e);
});
$('view').addEventListener('contextmenu', e => {
  const board = e.target.closest('#board');
  if (!board) return;
  e.preventDefault();
  const frame = e.target.closest('.pic');
  const r = board.getBoundingClientRect();
  const bx = e.clientX - r.left, by = e.clientY - r.top;
  if (frame) {
    const id = frame.dataset.id;
    selPic = id;
    renderAll();
    showCtx(e.clientX, e.clientY, [
      { label: 'Reset crop', run: () => resetCrop(id) },
      { label: 'Bring to front', run: () => bringFront(id) },
      { label: 'Delete picture', run: () => delPic(id) }
    ]);
  } else {
    showCtx(e.clientX, e.clientY, [
      { label: '+ Add picture', run: () => { pendingPos = { x: Math.max(0, bx - 100), y: Math.max(0, by - 60) }; $('boardIn').click(); } }
    ]);
  }
});
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ctx')) hideCtx();
});

renderAll();
</script>
